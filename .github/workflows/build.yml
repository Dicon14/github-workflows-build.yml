name: Build PSP Games APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone PPSSPP
        run: git clone --recurse-submodules --depth 1 https://github.com/hrydgard/ppsspp.git ppsspp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Patch PPSSPP (library screen + app id)
        run: |
          cat > ppsspp/android/src/org/ppsspp/ppsspp/LibraryActivity.java <<'JAVA'
          package org.ppsspp.ppsspp;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.TreeSet;

          /** شاشة مكتبة بأسلوب الصفحة الرئيسية لجهاز ألعاب: صف مربعات، المحدد يتكبّر. */
          public class LibraryActivity extends Activity {
              private SharedPreferences prefs;
              private final List<String> items = new ArrayList<>();
              private LinearLayout row;
              private HorizontalScrollView hs;
              private TextView titleView;
              private Button startBtn, delBtn;
              private int sel = 0;

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("lib", MODE_PRIVATE);
                  items.addAll(new TreeSet<>(prefs.getStringSet("uris", new HashSet<String>())));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF0A1B45, 0xFF2A5BD7}));
                  root.setPadding(0, dp(40), 0, dp(24));

                  hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(40), dp(50), dp(40), dp(50));
                  hs.addView(row);
                  root.addView(hs, new LinearLayout.LayoutParams(-1, 0, 1f));

                  titleView = new TextView(this);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setTextSize(22);
                  titleView.setGravity(Gravity.CENTER);
                  titleView.setPadding(dp(20), 0, dp(20), dp(12));
                  root.addView(titleView);

                  LinearLayout btns = new LinearLayout(this);
                  btns.setGravity(Gravity.CENTER);
                  startBtn = new Button(this);
                  startBtn.setText("▶ ابدأ");
                  startBtn.setOnClickListener(v -> play(sel));
                  delBtn = new Button(this);
                  delBtn.setText("حذف");
                  delBtn.setOnClickListener(v -> {
                      if (sel < items.size()) { items.remove(sel); save(); sel = 0; refresh(); }
                  });
                  btns.addView(startBtn);
                  btns.addView(delBtn);
                  root.addView(btns);

                  setContentView(root);
                  refresh();
              }

              private void refresh() {
                  row.removeAllViews();
                  for (int i = 0; i < items.size(); i++) {
                      final int idx = i;
                      TextView t = tile(displayName(Uri.parse(items.get(i))), idx == sel);
                      t.setOnClickListener(v -> { if (sel == idx) play(idx); else { sel = idx; refresh(); } });
                      row.addView(t);
                      if (idx == sel) {
                          final View f = t;
                          hs.post(() -> hs.smoothScrollTo(f.getLeft() - (hs.getWidth() - f.getWidth()) / 2, 0));
                      }
                  }
                  TextView add = tile("＋  إضافة ألعاب", false);
                  add.setOnClickListener(v -> pick());
                  row.addView(add);

                  boolean has = !items.isEmpty();
                  titleView.setText(has ? displayName(Uri.parse(items.get(sel))) : "المكتبة فارغة");
                  startBtn.setVisibility(has ? View.VISIBLE : View.GONE);
                  delBtn.setVisibility(has ? View.VISIBLE : View.GONE);
              }

              private TextView tile(String label, boolean focused) {
                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(8), dp(8), dp(8), dp(8));
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF1C2F66, 0xFF31205C});
                  g.setCornerRadius(dp(6));
                  if (focused) g.setStroke(dp(3), Color.WHITE);
                  t.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(150), dp(150));
                  lp.setMargins(dp(14), 0, dp(14), 0);
                  t.setLayoutParams(lp);
                  t.setScaleX(focused ? 1.25f : 1f);
                  t.setScaleY(focused ? 1.25f : 1f);
                  return t;
              }

              private void pick() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, 1);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != 1 || res != RESULT_OK || data == null) return;
                  List<Uri> uris = new ArrayList<>();
                  if (data.getClipData() != null)
                      for (int k = 0; k < data.getClipData().getItemCount(); k++)
                          uris.add(data.getClipData().getItemAt(k).getUri());
                  if (data.getData() != null) uris.add(data.getData());
                  for (Uri u : uris) {
                      try { getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION); }
                      catch (Exception ignored) {}
                      if (!items.contains(u.toString())) items.add(u.toString());
                  }
                  save();
                  refresh();
              }

              private void save() { prefs.edit().putStringSet("uris", new HashSet<>(items)).apply(); }

              private String displayName(Uri u) {
                  try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) return c.getString(c.getColumnIndexOrThrow(OpenableColumns.DISPLAY_NAME));
                  } catch (Exception ignored) {}
                  return u.getLastPathSegment() != null ? u.getLastPathSegment() : "لعبة";
              }

              /** يشغّل اللعبة داخل محرك المحاكي المضمَّن في نفس التطبيق (لا يفتح تطبيقًا خارجيًا). */
              private void play(int i) {
                  if (i >= items.size()) return;
                  try {
                      Intent in = new Intent(this, PpssppActivity.class);
                      in.setAction(Intent.ACTION_VIEW);
                      in.setData(Uri.parse(items.get(i)));
                      in.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(in);
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذّر التشغيل: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }
          JAVA
          python3 - <<'PY'
          import re
          m = 'ppsspp/android/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          s = re.sub(r'<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>', '', s)
          act = ('<activity android:name=".LibraryActivity" android:exported="true" '
                 'android:label="PSP Library"><intent-filter>'
                 '<action android:name="android.intent.action.MAIN"/>'
                 '<category android:name="android.intent.category.LAUNCHER"/>'
                 '</intent-filter></activity>')
          assert '</application>' in s, 'manifest layout changed'
          s = s.replace('</application>', act + '</application>', 1)
          open(m, 'w', encoding='utf-8').write(s)
          g = 'ppsspp/android/build.gradle'
          t = open(g, encoding='utf-8').read()
          t2 = re.sub(r'''applicationId\s*=?\s*["']org\.ppsspp\.ppsspp["']''',
                      'applicationId "com.mypsp.games"', t)
          print('applicationId changed:', t != t2)
          open(g, 'w', encoding='utf-8').write(t2)
          PY

      - name: Build APK
        working-directory: ppsspp/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PspGames-apk
          path: ppsspp/android/**/*.apk
